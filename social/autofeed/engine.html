<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Feed engine: 1080x1350. Theme vars come from brands.json (tema). Layout chosen per spec. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Fira Sans",sans-serif}
#post{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--ink);background:var(--floor2)}
.dark#post{background:var(--dark);color:#fff}
.sky{position:absolute;left:0;top:0;width:1080px;height:760px}
.floor{position:absolute;left:0;right:0;top:752px;bottom:0;background:linear-gradient(180deg,var(--floor1) 0%,var(--floor2) 100%)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.floor::after{content:"";position:absolute;left:-10%;right:-10%;top:0;height:140px;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.9),transparent 70%)}
.wall{position:absolute;top:0;bottom:598px;width:230px;background:linear-gradient(90deg,var(--wall1),var(--wall2));box-shadow:0 0 60px rgba(0,0,0,.08)}
.logo{position:absolute;left:56px;top:46px;height:var(--logoH,96px)}
.tr{position:absolute;right:56px;top:58px;text-align:right;font-weight:800;font-size:16px;letter-spacing:.24em;line-height:1.55;color:var(--ink);opacity:.85}
.dark .tr{color:#fff}
.h{font-family:"Anton",sans-serif;text-transform:uppercase;line-height:.92;transform:skewX(-7deg);letter-spacing:.005em;white-space:nowrap}
.acc{color:var(--accTxt)}
.hl>div{margin-bottom:.14em}.hl .acc{display:inline-block;color:var(--ink);background:var(--acc);padding:.06em .14em .02em;line-height:.95;box-shadow:.06em .06em 0 var(--ink)}
.dark .acc{color:var(--accDark);background:none;padding:0}
.script{font-family:"Kaushan Script",cursive;transform:rotate(-6deg);line-height:1.15}
.sub{font-weight:800;font-size:22px;letter-spacing:.3em;text-transform:uppercase}
.pw{position:absolute}
.pw img{display:block;width:100%;filter:drop-shadow(0 30px 26px rgba(10,20,40,.28))}
.pw .rf{position:absolute;left:0;top:100%;width:100%;transform:scaleY(-1);opacity:.18;filter:blur(1.5px);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 30%);mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 30%)}
.shadow{position:absolute;height:56px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(10,20,40,.35) 0%,rgba(10,20,40,0) 70%)}
.feats{position:absolute;left:56px;right:56px;bottom:150px;display:flex;justify-content:space-between}
.feat{width:220px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
.ic{width:74px;height:74px;border-radius:50%;background:var(--icBg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px var(--icShadow),inset 0 0 0 4px rgba(255,255,255,.22);flex:none}
.ic svg{width:38px;height:38px;stroke:var(--icFg)}
.ic svg[fill="cur"]{fill:var(--icFg);stroke:none}
.feat b{font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1.15;text-transform:uppercase}
.cta{position:absolute;left:50%;bottom:42px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 30px 12px 12px;border-radius:999px;background:var(--ctaBg);color:var(--ctaFg);box-shadow:0 14px 30px rgba(0,0,0,.22);white-space:nowrap}
.cta .wa{width:74px;height:74px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #fff}
.cta small{display:block;font-weight:800;font-size:15px;letter-spacing:.24em;opacity:.85}
.cta strong{display:block;font-weight:900;font-size:40px;line-height:1.05}
.cta .arr{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--accOn);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;margin-left:6px}
.sticker{position:absolute;width:240px;height:240px;border-radius:50%;background:var(--acc);color:var(--accOn);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.25),0 0 0 10px rgba(255,255,255,.75);transform:rotate(-10deg)}
.sticker .s1{font-weight:800;font-size:22px;letter-spacing:.2em}.sticker .s2{font-family:"Anton";font-size:92px;line-height:.95}.sticker .s3{font-weight:800;font-size:24px}
.card{background:#fff;border-radius:26px;box-shadow:0 16px 36px rgba(10,20,40,.12)}
.vlist{position:absolute;right:46px;display:flex;flex-direction:column;gap:20px;padding:26px 22px}
.vlist div{display:flex;align-items:center;gap:14px;font-weight:900;font-size:17px;letter-spacing:.05em;line-height:1.1;text-transform:uppercase}
.vlist .ic{width:56px;height:56px}.vlist .ic svg{width:28px;height:28px}
.foot{position:absolute;font-size:14px;font-weight:700;opacity:.65}
table{border-collapse:collapse;width:100%}
</style></head>
<body><div id="post"></div>
<script>
const I = {
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/><path d="M8.5 10l2.5 2.5 4.5-5"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1z"/><path d="M14 9h4l4 4v3h-8z"/><circle cx="5.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/><path d="M8 11h8M8 14h5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c3 0 5 2 5 5"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>',
  cap:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L1 9l11 5 11-5z"/><path d="M5 11v5c2 2 4.5 3 7 3s5-1 7-3v-5"/></svg>',
  brief:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V4h8v3M2 13h20"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="cur"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z"/></svg>',
};
const waIcon='<svg viewBox="0 0 32 32" width="44" height="44"><path fill="#fff" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.8.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4z"/></svg>';

function rnd(seed){let s=seed%233280;return()=>(s=(s*9301+49297)%233280)/233280}
function landmark(k,x,c){
  if(k==='monas') return `<g fill="${c}"><rect x="${x-55}" y="640" width="110" height="112"/><polygon points="${x-90},680 ${x+90},680 ${x+70},640 ${x-70},640"/><polygon points="${x-12},640 ${x+12},640 ${x+7},360 ${x-7},360"/><ellipse cx="${x}" cy="352" rx="14" ry="10"/><path d="M${x-10} 345 q10 -40 10 -50 q0 10 10 50z" fill="#f0c24a"/></g>`;
  if(k==='kujang') return `<g fill="${c}"><rect x="${x-60}" y="700" width="120" height="52"/><rect x="${x-26}" y="560" width="52" height="140"/><path d="M${x-14} 560 C ${x-30} 470, ${x-10} 400, ${x+6} 330 C ${x+14} 380, ${x+34} 420, ${x+16} 470 C ${x+30} 500, ${x+20} 530, ${x+14} 560 Z"/></g>`;
  if(k==='sate') return `<g fill="${c}"><rect x="${x-220}" y="640" width="440" height="112"/><polygon points="${x-240},640 ${x+240},640 ${x+200},610 ${x-200},610"/><rect x="${x-70}" y="560" width="140" height="80"/><polygon points="${x-90},560 ${x+90},560 ${x},500"/><rect x="${x-4}" y="430" width="8" height="70"/>${[0,1,2,3,4,5].map(i=>`<circle cx="${x}" cy="${445+i*10}" r="${6-i*0.4}"/>`).join('')}${Array.from({length:12},(_,i)=>`<rect x="${x-200+i*36}" y="660" width="14" height="70" fill="#fff" opacity=".35"/>`).join('')}</g>`;
  if(k==='tugu') return `<g fill="${c}"><rect x="${x-50}" y="700" width="100" height="52"/><polygon points="${x-30},700 ${x+30},700 ${x+20},520 ${x-20},520"/><circle cx="${x}" cy="505" r="22"/><polygon points="${x-10},488 ${x+10},488 ${x},420"/></g>`;
  return '';
}
function scene(T, seed, lm, lmX){
  const r=rnd(seed*97+13); let far='',mid='',near='',refl='';
  let x=-20; while(x<1100){const w=40+r()*60,h=180+r()*300; far+=`<rect x="${x}" y="${752-h}" width="${w}" height="${h}" fill="${T.bFar}"/>`; x+=w+4+r()*10}
  x=-30; while(x<1110){const w=60+r()*90,h=120+r()*260; mid+=`<rect x="${x}" y="${752-h}" width="${w}" height="${h}" fill="url(#gm${seed})"/>`;
    for(let c=x+8;c<x+w-6;c+=16) mid+=`<rect x="${c}" y="${752-h+10}" width="2" height="${h-14}" fill="#fff" opacity=".18"/>`; x+=w+10+r()*30}
  x=-60; while(x<1140){const w=90+r()*140,h=70+r()*170; near+=`<rect x="${x}" y="${752-h}" width="${w}" height="${h}" fill="url(#gn${seed})"/>`;
    for(let yy=752-h+14;yy<744;yy+=22) near+=`<rect x="${x+8}" y="${yy}" width="${w-16}" height="4" fill="#fff" opacity=".3"/>`; x+=w+20+r()*60}
  return `<svg class="sky" viewBox="0 0 1080 760"><defs>
   <linearGradient id="s${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky1}"/><stop offset="1" stop-color="${T.sky2}"/></linearGradient>
   <linearGradient id="gm${seed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T.bMid1}"/><stop offset="1" stop-color="${T.bMid2}"/></linearGradient>
   <linearGradient id="gn${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.bNear1}"/><stop offset="1" stop-color="${T.bNear2}"/></linearGradient>
   <radialGradient id="sun${seed}"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
   <linearGradient id="haze${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="${T.sky2}" stop-opacity="0"/><stop offset="1" stop-color="${T.sky2}" stop-opacity=".75"/></linearGradient></defs>
   <rect width="1080" height="760" fill="url(#s${seed})"/><circle cx="${300+r()*500}" cy="200" r="260" fill="url(#sun${seed})"/>
   ${far}${landmark(lm,lmX,T.lm)}<rect width="1080" height="760" fill="url(#haze${seed})"/>${mid}${near}</svg><div class="floor"></div>`;
}
function H(lines, sizes, opts={}){ // lines: "*X*" = accent
  return lines.map((l,i)=>`<div style="font-size:${sizes[i]||sizes[sizes.length-1]}px">${l.replace(/\*(.+?)\*/g,'<span class="acc">$1</span>')}</div>`).join('');
}
function prod(src,x,y,w,rot=0,refl=true){return `<div class="shadow" style="left:${x+w*.08}px;top:${y+w*.62}px;width:${w*.84}px"></div><div class="pw" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg)"><img src="assets/${src}">${refl?`<img class="rf" src="assets/${src}">`:''}</div>`}
function feats(list,style=''){return `<div class="feats" style="${style}">${list.map(([i,t])=>`<div class="feat"><div class="ic">${I[i]}</div><b>${t}</b></div>`).join('')}</div>`}
function cta(B,style=''){return `<div class="cta" style="${style}"><div class="wa">${waIcon}</div><div><small>BOOKING SEKARANG</small><strong>${B.wa}</strong></div><div class="arr">›</div></div>`}
function head(B,dark){return `<img class="logo" src="assets/${dark?B.logoDark:B.logo}"><div class="tr">${B.topText.join('<br>')}</div>`}
const fmt=n=>n;

const L = {
 hero:(S,B,T)=>`${scene(T,S.seed,B.landmark,B.landmarkX)}${head(B)}
  <div class="h ${T.hl?'hl':''}" style="position:absolute;left:60px;top:175px">${H(S.judul,S.ukuran||[140,180])}</div>
  <div class="sub" style="position:absolute;left:64px;top:${S.subTop||545}px">${S.sub||'Harian · Mingguan · Bulanan'}</div>
  ${prod(S.produk||'macbook.png',120,560,820)}
  ${S.harga?`<div class="sticker" style="right:46px;top:300px"><div class="s1">${S.harga[0]}</div><div class="s2">${S.harga[1]}</div><div class="s3">${S.harga[2]}</div></div>`:''}
  ${feats(S.fitur||B.fitur)}${cta(B)}`,
 produk:(S,B,T)=>`${scene(T,S.seed,B.landmark,B.landmarkX)}${head(B)}
  ${S.script?`<div class="script" style="position:absolute;left:300px;top:165px;font-size:48px;color:var(--scriptC)">${S.script}</div>`:''}
  <div class="h ${T.hl?'hl':''}" style="position:absolute;left:60px;top:240px">${H(S.judul,S.ukuran||[120,165])}</div>
  <div class="sub" style="position:absolute;left:64px;top:545px;font-size:23px;letter-spacing:.16em">${S.sub||''}</div>
  <div class="vlist card" style="top:215px">${(S.fitur||B.fitur).map(([i,t])=>`<div><div class="ic">${I[i]}</div>${t}</div>`).join('')}</div>
  ${prod(S.produk,90,600,880)}
  <div style="position:absolute;left:60px;bottom:148px;display:flex;gap:14px">${(S.paket||[]).map(([a,b])=>`<div class="card" style="padding:12px 24px;text-align:center"><div style="font-weight:800;font-size:17px;letter-spacing:.18em;opacity:.6;text-transform:uppercase">${a}</div><div style="font-family:Anton;font-size:44px;color:var(--priceC)">${b}</div></div>`).join('')}</div>
  ${cta(B,'left:auto;right:46px;transform:none')}`,
 pricelist:(S,B,T)=>`<div style="position:absolute;inset:0;background:linear-gradient(180deg,var(--sky2) 0%,#fff 45%)"></div><div style="position:absolute;right:-180px;top:-240px;width:560px;height:560px;border-radius:50%;background:var(--acc)"></div>
  <img class="logo" src="assets/${B.logo}">
  <div class="h" style="position:absolute;left:60px;top:175px;font-size:56px">${S.kecil||'Price List'}</div>
  <div class="h ${T.hl?'hl':''}" style="position:absolute;left:56px;top:228px;font-size:122px">${H([S.judul[0]],[122])}</div>
  <div style="position:absolute;left:64px;top:372px;background:var(--ink);color:#fff;font-weight:800;font-size:19px;letter-spacing:.2em;padding:8px 18px;border-radius:8px">${S.sub||'HARGA PER UNIT'}</div>
  ${prod(S.produk||'macbook-pro-m1.png',800,40,240,-8,false)}
  <div class="card" style="position:absolute;left:44px;right:44px;top:440px;overflow:hidden">
  <table><tr style="background:var(--acc);color:var(--accOn);font-weight:900;font-size:18px;letter-spacing:.14em"><td style="padding:15px 22px" colspan="2">UNIT</td><td style="text-align:right">HARIAN</td><td style="text-align:right">MINGGUAN</td><td style="text-align:right;padding-right:22px">BULANAN</td></tr>
  ${S.tabel.map((r,i)=>`<tr style="border-top:2px solid #eef1f6;${i%2?'background:var(--rowAlt)':''}"><td style="width:108px;padding:7px 0 7px 18px"><img src="assets/${r[0]}" style="width:90px;height:60px;object-fit:contain"></td><td><div style="font-weight:900;font-size:24px">${r[1]}</div><div style="font-weight:700;font-size:16px;opacity:.6">${r[2]}</div></td><td style="text-align:right;font-weight:900;font-size:24px;color:var(--priceC)">${r[3]}</td><td style="text-align:right;font-weight:800;font-size:22px">${r[4]}</td><td style="text-align:right;padding-right:22px;font-weight:800;font-size:22px">${r[5]}</td></tr>`).join('')}</table></div>
  <div style="position:absolute;left:44px;right:44px;bottom:34px;height:96px;border-radius:24px;background:var(--ctaBg);color:var(--ctaFg);display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 14px">
   <div style="display:flex;align-items:center;gap:16px"><div style="width:68px;height:68px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center">${waIcon}</div><div><div style="font-weight:800;font-size:14px;letter-spacing:.24em;opacity:.8">BOOKING & INFO</div><div style="font-weight:900;font-size:36px">${B.wa}</div></div></div>
   <div style="text-align:right;font-weight:800;font-size:19px;line-height:1.5"><div>${S.footKanan||'Harian · Mingguan · Bulanan'}</div><div style="opacity:.75">${B.web||''}</div></div></div>
  ${S.catatan?`<div class="foot" style="left:50px;bottom:138px">${S.catatan}</div>`:''}`,
 persona:(S,B,T)=>`${scene(T,S.seed,B.landmark,B.landmarkX)}${head(B)}
  ${S.script?`<div class="script" style="position:absolute;right:66px;top:200px;font-size:48px;text-align:right;color:var(--scriptC)">${S.script}</div>`:''}
  <div class="h ${T.hl?'hl':''}" style="position:absolute;left:60px;top:180px;line-height:.95">${H(S.judul,S.ukuran||[160,200,62])}</div>
  ${prod(S.produk,200,600,700)}
  ${feats(S.fitur||B.fitur)}${cta(B)}`,
 siapkerja:(S,B,T)=>`${scene(T,S.seed,B.landmark,B.landmarkX)}
  <div style="position:absolute;right:0;top:0;width:300px;height:1350px;background:var(--panel)"></div>
  <div style="position:absolute;right:28px;top:200px;width:244px;color:var(--panelFg)">
   <div style="font-weight:800;font-size:16px;letter-spacing:.2em;margin-bottom:26px">${S.panelJudul||'SOLUSI LAPTOP<br>UNTUK KEBUTUHAN<br>KAMU'}</div>
   ${(S.list||[['brief','Kerja'],['cap','Kuliah'],['users','Event'],['home','WFH']]).map(([i,t])=>`<div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;font-weight:900;font-size:23px;letter-spacing:.08em;text-transform:uppercase"><div class="ic" style="width:60px;height:60px;background:rgba(255,255,255,.16);box-shadow:none"><span style="display:contents">${I[i].replace('<svg','<svg style="stroke:currentColor"')}</span></div>${t}</div>`).join('')}</div>
  <img class="logo" src="assets/${B.logo}">
  <div class="h ${T.hl?'hl':''}" style="position:absolute;left:60px;top:180px;line-height:.9">${H(S.judul,S.ukuran||[190,190,190])}</div>
