<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* TikTok video engine v2 — fresh/light. 1080x1920, 128 BPM (1 beat = .46875s).
   Safe zone: text within x 70..930, y 160..1500 (TikTok UI covers bottom & right). */
:root{--B:.46875s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:"Plus Jakarta Sans","Fira Sans",sans-serif}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;color:var(--ink);background:var(--bgB)}
.sc{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(165deg,var(--bgA) 0%,var(--bgB) 60%,var(--bgA) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.grain{position:absolute;inset:-50%;opacity:.05;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");z-index:70;animation:grain .3s steps(3) infinite}
.cam{position:absolute;inset:0}
.H{font-weight:800;letter-spacing:-.025em;line-height:1.06}
.w{display:inline-block;white-space:pre}
.mk{position:relative;display:inline-block;z-index:0}
.mk::before{content:"";position:absolute;left:-.1em;right:-.1em;bottom:.04em;height:.5em;background:var(--mark);z-index:-1;border-radius:.12em;transform-origin:left;transform:scaleX(var(--mx,1))}
.pill{display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:14px 28px 14px 18px;font-weight:800;font-size:34px;box-shadow:0 12px 30px rgba(20,30,60,.12)}
.pill .em{font-size:40px}
.card{background:#fff;border-radius:40px;box-shadow:0 24px 60px rgba(20,30,60,.13)}
.brand{position:absolute;left:70px;top:150px;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-radius:24px;padding:12px 20px;box-shadow:0 10px 26px rgba(20,30,60,.10)}
.brand img{height:var(--logoPillH,64px);display:block}
.prog{position:absolute;left:70px;right:70px;top:110px;height:8px;border-radius:9px;background:rgba(0,0,0,.08);z-index:60;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--pop);border-radius:9px}
.prod{position:absolute;filter:drop-shadow(0 50px 40px rgba(20,30,60,.28))}
.shadowE{position:absolute;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(20,30,60,.25),transparent 70%)}
.sticker{position:absolute;width:190px;height:190px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:0 20px 40px rgba(20,30,60,.18)}
.bub{max-width:800px;padding:28px 34px;border-radius:40px;font-weight:700;font-size:46px;line-height:1.3;box-shadow:0 10px 24px rgba(20,30,60,.10)}
.me{align-self:flex-end;background:#d9fdd3;border-bottom-right-radius:10px}
.ad{align-self:flex-start;background:#fff;border-bottom-left-radius:10px}
.dots{display:inline-flex;gap:10px}.dots i{width:16px;height:16px;border-radius:50%;background:#9aa3b2;animation:dot .9s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.chk path{stroke-dasharray:40;stroke-dashoffset:40}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-3%)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,80px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-140px,-60px) scale(.95)}}
@keyframes sceneIn{from{transform:translateY(100%);filter:blur(12px)}to{transform:none;filter:none}}
@keyframes camZoom{from{transform:scale(1)}to{transform:scale(1.045)}}
@keyframes wordIn{0%{opacity:0;transform:translateY(60px) rotate(4deg);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes mark{from{--mx:0}to{--mx:1}}
@property --mx{syntax:'<number>';inherits:true;initial-value:1}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-8deg)}60%{opacity:1;transform:scale(1.08) rotate(3deg)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
@keyframes up{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-140px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
@keyframes floatTilt{0%,100%{transform:perspective(1600px) rotateY(-14deg) rotateX(4deg) translateY(0)}50%{transform:perspective(1600px) rotateY(10deg) rotateX(-2deg) translateY(-30px)}}
@keyframes prodIn{from{opacity:0;transform:translateY(200px) scale(.8)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-22px) rotate(calc(var(--r,0deg) * -1))}}
@keyframes dot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tap{0%{transform:translate(60px,60px) scale(1)}40%{transform:translate(0,0) scale(1)}55%{transform:translate(0,0) scale(.85)}70%,100%{transform:translate(0,0) scale(1)}}
@keyframes ripple{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}
@keyframes press{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
@keyframes beat{0%{transform:scale(1.04)}30%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes fadeOut{to{opacity:0}}
.a{animation-fill-mode:both!important}
</style></head>
<body><div id="v"></div>
<script>
const Bs=0.46875;
const waIcon=(s=58)=>`<svg viewBox="0 0 32 32" width="${s}" height="${s}"><path fill="#fff" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.8.9 3.8.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.6-.4z"/></svg>`;
const SEARCH='<svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>';
const CHK=(b)=>`<svg class="chk" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7" style="animation:draw .35s calc(${b}*var(--B)) ease-out both"/></svg>`;
const XX='<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const A=(n,d,b,e='cubic-bezier(.2,.9,.2,1)')=>`animation:${n} ${d}s calc(${b}*var(--B)) ${e} both`;
const img=f=>`assets/${f}`;
const hooks=[];
const strip=s=>String(s).replace(/<br>/g,' ').replace(/\*/g,'');
// kinetic words: "*kata*" -> stabilo; reveal per kata mulai beat b, jeda st (beat)
function words(text,b,st=.22,cls=''){ let i=0; return String(text).split('<br>').map(line=>line.split(/(\*[^*]+\*|\s+)/).filter(Boolean).map(tok=>{
  if(/^\s+$/.test(tok)) return ' ';
  const m=tok.startsWith('*'); const t=m?tok.slice(1,-1):tok; const d=b+(i++)*st;
  return m?`<span class="w mk a" style="${A('wordIn',.45,d)}">${t}</span>`:`<span class="w a" style="${A('wordIn',.45,d)}">${t}</span>`;}).join('')).join('<br>');}
function markAnim(html,b){return html}
function bg(T,seed=0){const r=(n)=>((seed*9301+n*49297)%233280)/233280;
  return `<div class="bg"></div>
  <div class="blob" style="width:760px;height:760px;left:${-260+r(1)*200}px;top:${-120+r(2)*300}px;background:var(--blob1);animation:drift1 9s ${-r(3)*9}s ease-in-out infinite"></div>
  <div class="blob" style="width:680px;height:680px;right:${-260+r(4)*160}px;top:${900+r(5)*300}px;background:var(--blob2);animation:drift2 11s ${-r(6)*11}s ease-in-out infinite"></div>`;}
function prod(f,x,y,w,b){return `<div class="shadowE a" style="left:${x+w*.12}px;top:${y+w*.66}px;width:${w*.76}px;${A('up',.5,b)}"></div><div class="a" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;${A('prodIn',.6,b)}"><img class="prod" src="${img(f)}" style="position:relative;width:100%;animation:floatTilt 4.5s ease-in-out infinite"></div>`}
function countUp(id,target,b0,dur=1.1){const n=parseInt(String(target).replace(/\D/g,''))||0; hooks.push(t=>{const e=document.getElementById(id); if(!e) return; const p=Math.max(0,Math.min(1,(t-b0*Bs)/dur)); const v=Math.round(n*(1-Math.pow(1-p,3))); e.textContent=v.toLocaleString('id-ID');});}

const S={
 hook:(s,b0,n,B)=>`${bg(B,b0+1)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div style="position:absolute;left:70px;right:110px;top:300px">
   ${s.kicker?`<div class="pill a" style="${A('popIn',.4,b0)}"><span class="em">${s.emoji||'👀'}</span>${s.kicker}</div>`:''}
   <div class="H" style="margin-top:46px;font-size:${s.size||118}px">${words(s.baris.join('<br>'),b0+.6,.22)}</div>
  </div>
  ${s.produk?prod(s.produk,170,1040,740,b0+2):''}
  ${s.stiker?`<div class="sticker a" style="right:90px;top:${s.produk?960:1100}px;--r:12deg;${A('popIn',.4,b0+2.4)}"><span style="animation:bounce 1.4s infinite">${s.stiker}</span></div>`:''}
  </div>`,
 chat:(s,b0,n,B)=>{let t=b0+.6; const items=s.pesan.map(([who,txt])=>{let h=''; if(who==='admin'){h+=`<div class="bub ad a" data-bs="${t}" data-be="${t+.9}" style="${A('up',.3,t)}"><span class="dots"><i></i><i></i><i></i></span></div>`; t+=.9;} h+=`<div class="bub ${who==='admin'?'ad':'me'} a" style="${A('up',.35,t)}">${txt}</div>`; t+= (who==='admin'?1.4:1.1); return h;}).join('');
  return `${bg(B,b0+2)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div class="card a" style="position:absolute;left:60px;right:60px;top:280px;padding:26px 30px;display:flex;align-items:center;gap:22px;border-radius:32px;${A('up',.35,b0)}">
    <div style="width:96px;height:96px;border-radius:50%;background:var(--bgA);display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="${img(B.logo)}" style="width:84px"></div>
    <div><div style="font-weight:800;font-size:40px">${s.nama||('Admin '+(B.brandNama||''))}</div><div style="font-weight:700;font-size:28px;color:#1faa59">online</div></div></div>
  <div style="position:absolute;left:70px;right:70px;top:470px;display:flex;flex-direction:column;gap:26px">${items}</div>${s.produk?prod(s.produk,300,s.produkTop||1130,480,b0+n-2.2):''}${s.stiker?`<div class="sticker a" style="left:90px;top:${s.produkTop||1150}px;--r:-10deg;${A('popIn',.4,b0+n-2)}"><span style="animation:bounce 1.4s infinite">${s.stiker}</span></div>`:''}</div>`},
 cari:(s,b0,n,B)=>{const id='kw'+b0; const sug=s.saran||[s.kata, s.kata+' murah', s.kata+' terdekat'];
  hooks.push(t=>{const st=(b0+.6)*Bs,k=s.kata,m=Math.max(0,Math.min(k.length,Math.floor((t-st)/.05)));const e=document.getElementById(id); if(e) e.textContent=k.slice(0,m);});
  const done=b0+.6+s.kata.length*.05/Bs;
  return `${bg(B,b0+3)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div class="H a" style="position:absolute;left:70px;right:110px;top:290px;font-size:84px;${A('up',.4,b0)}">${s.judul||'Lagi cari ini?'} 👇</div>
  <div class="card a" style="position:absolute;left:60px;right:60px;top:500px;border-radius:44px;overflow:hidden;${A('popIn',.4,b0+.2)}">
   <div style="display:flex;align-items:center;gap:22px;padding:34px 36px;color:var(--ink)">${SEARCH}<div style="font-weight:700;font-size:46px;white-space:nowrap;overflow:hidden"><span id="${id}"></span><span style="display:inline-block;width:4px;height:50px;background:var(--pop);vertical-align:middle;margin-left:4px"></span></div></div>
   ${sug.slice(0,3).map((x,i)=>`<div class="a" style="display:flex;align-items:center;gap:22px;padding:22px 36px;border-top:2px solid #eef0f4;font-weight:600;font-size:38px;opacity:.75;${i===0?'background:var(--bgA);opacity:1;font-weight:800':''};${A('slideL',.3,done+.2+i*.25)}"><span style="opacity:.5">${SEARCH.replace('54','36').replace('54','36')}</span>${x}</div>`).join('')}
  </div>
  <div class="card a" style="position:absolute;left:60px;right:60px;top:1010px;padding:36px;display:flex;gap:30px;align-items:center;border:4px solid var(--pop);${A('up',.45,b0+n-2.6)}">
   <img src="${img(B.logo)}" style="width:170px;flex:none">
   <div><div style="font-weight:700;font-size:30px;opacity:.6">${(B.web||'').toLowerCase()}</div><div class="H" style="font-size:66px;margin-top:6px">${words(s.jawab,b0+n-2.2,.15)}</div></div></div>${s.produk?prod(s.produk,560,1250,400,b0+n-1.8):''}</div>`},
 poin:(s,b0,n,B)=>`${bg(B,b0+4)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div style="position:absolute;left:70px;right:110px;top:290px">
   <div class="a" style="display:inline-flex;width:150px;height:150px;border-radius:44px;background:var(--pop);color:var(--popOn);align-items:center;justify-content:center;font-weight:800;font-size:96px;--r:-6deg;${A('popIn',.4,b0)}">${s.nomor}</div>
   <div class="H" style="margin-top:44px;font-size:${s.size||104}px">${words(s.judul,b0+.6,.2)}</div>
   <div class="card a" style="margin-top:44px;padding:36px 40px;font-weight:600;font-size:44px;line-height:1.38;${A('up',.4,b0+2)}">${s.isi}</div>
  </div>${s.produk?prod(s.produk,560,1180,420,b0+2.6):''}</div>`,
 harga:(s,b0,n,B)=>{const id='hp'+b0; const raw=String(s.harga); const num=(raw.match(/[\d.,]+/)||['0'])[0]; const big=/jt/i.test(raw);
  if(!big) countUp(id,num.replace(/[.,]/g,'').length<=3?parseInt(num)*1000:num,b0+2);
  return `${bg(B,b0+5)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div style="position:absolute;left:0;right:0;top:290px;text-align:center"><span class="pill a" style="${A('popIn',.35,b0)}"><span class="em">${s.emoji||'🔥'}</span>${s.label||'Paling hemat'}</span></div>
  <div class="H" style="position:absolute;left:60px;right:60px;top:400px;text-align:center;font-size:${s.size||120}px">${words(s.unit,b0+.4,.2)}</div>
  ${prod(s.produk,190,560,700,b0+1)}
  <div class="a" style="position:absolute;left:0;right:0;top:1060px;text-align:center;${A('popIn',.45,b0+2)}">
   <span class="card" style="display:inline-block;padding:26px 50px;border-radius:999px;background:var(--pop);color:var(--popOn)"><span style="font-weight:700;font-size:44px;vertical-align:top;line-height:2">Rp</span><span id="${id}" class="H" style="font-size:130px">${big?num:'0'}</span><span style="font-weight:800;font-size:48px">${big?'jt':''}${s.satuan||'/hari'}</span></span></div>
  <div style="position:absolute;left:70px;right:70px;top:1300px;display:flex;gap:22px;justify-content:center">${(s.paket||[]).map(([a,v],i)=>`<div class="card a" style="padding:20px 34px;text-align:center;${A('up',.35,b0+3+i*.35)}"><div style="font-weight:700;font-size:28px;opacity:.55">${a}</div><div class="H" style="font-size:56px;color:var(--pop)">${v}</div></div>`).join('')}</div></div>`},
 list:(s,b0,n,B)=>`${bg(B,b0+6)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div class="H" style="position:absolute;left:70px;right:110px;top:290px;font-size:${s.size||104}px">${words(s.judul,b0,.2)}</div>
  <div style="position:absolute;left:60px;right:60px;top:${s.top||560}px;display:flex;flex-direction:column;gap:26px">${s.item.map((t,i)=>{const d=b0+1+i*(s.jeda||1);return `<div class="card a" style="display:flex;align-items:center;gap:28px;padding:30px 34px;${A('slideL',.4,d)}"><div style="flex:none;width:84px;height:84px;border-radius:26px;background:var(--pop);color:var(--popOn);display:flex;align-items:center;justify-content:center">${CHK(d+.3)}</div><div style="font-weight:800;font-size:46px;line-height:1.2">${t}</div></div>`}).join('')}</div>
  ${s.produk?prod(s.produk,560,s.produkTop||1200,420,b0+n-2.5):''}</div>`,
 banding:(s,b0,n,B)=>`${bg(B,b0+7)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div class="H" style="position:absolute;left:70px;right:110px;top:290px;font-size:${s.size||110}px">${words(s.judul,b0,.2)}</div>
  <div style="position:absolute;left:50px;right:50px;top:${s.top||560}px;display:flex;gap:24px;align-items:flex-start">
   <div class="card a" style="flex:1;padding:38px 30px;opacity:.92;background:#f3f4f7;${A('slideL',.45,b0+1)}"><div class="H" style="font-size:66px;opacity:.6">${s.kiri.judul}</div><div style="margin-top:26px;display:flex;flex-direction:column;gap:24px">${s.kiri.item.map(t=>`<div style="display:flex;gap:14px;font-weight:700;font-size:38px;line-height:1.25;opacity:.75"><span style="flex:none;color:#d64545">${XX}</span>${t}</div>`).join('')}</div></div>
   <div class="card a" style="flex:1;padding:38px 30px;margin-top:70px;background:var(--pop);color:var(--popOn);position:relative;${A('slideR',.45,b0+2)}"><div class="H" style="font-size:66px">${s.kanan.judul}</div><div style="margin-top:26px;display:flex;flex-direction:column;gap:24px">${s.kanan.item.map((t,i)=>`<div style="display:flex;gap:14px;font-weight:800;font-size:38px;line-height:1.25"><span style="flex:none">${CHK(b0+2.5+i*.3)}</span>${t}</div>`).join('')}</div>
    <div class="sticker a" style="width:150px;height:150px;font-size:80px;right:-30px;top:-80px;--r:14deg;${A('popIn',.4,b0+3.2)}">🏆</div></div>
  </div>${s.produk?prod(s.produk,130,s.produkTop||1170,440,b0+3.5):''}</div>`,
 tabel:(s,b0,n,B)=>`${bg(B,b0+8)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div style="position:absolute;left:70px;top:270px"><span class="pill a" style="${A('popIn',.35,b0)}"><span class="em">🏷️</span>${s.kicker||'Price list'}</span></div>
  <div class="H" style="position:absolute;left:70px;right:110px;top:380px;font-size:${s.size||96}px">${words(s.judul||'Harga *per hari*',b0+.3,.2)}</div>
  <div style="position:absolute;left:50px;right:50px;top:520px;display:flex;flex-direction:column;gap:14px">
   ${s.baris.map(([f,nm,h],i)=>`<div class="card a" style="display:flex;align-items:center;gap:22px;padding:12px 26px 12px 16px;border-radius:30px;${A('slideL',.3,b0+1+i*(s.jeda||.5))}"><div style="width:130px;height:84px;border-radius:20px;background:var(--bgA);display:flex;align-items:center;justify-content:center"><img src="${img(f)}" style="width:112px;height:72px;object-fit:contain"></div><div style="flex:1;font-weight:800;font-size:38px">${nm}</div><div style="background:var(--pop);color:var(--popOn);border-radius:999px;padding:8px 22px;font-weight:800;font-size:38px">${h}</div></div>`).join('')}
  </div>
  <div class="a" style="position:absolute;left:70px;right:110px;top:${s.catTop||(540+s.baris.length*122)}px;font-weight:700;font-size:34px;opacity:.7;${A('up',.35,b0+n-2)}">${s.catatan||'Mingguan & bulanan lebih hemat · Tanpa deposit'}</div></div>`,
 cta:(s,b0,n,B)=>{const id='ct'+b0; countUp(id,79000,b0+1.6,.9);
  return `${bg(B,b0+9)}<div class="cam" style="animation:camZoom ${n*Bs}s calc(${b0}*var(--B)) linear both">
  <div class="a" style="position:absolute;left:0;right:0;top:280px;text-align:center;${A('popIn',.5,b0)}"><div class="card" style="display:inline-block;padding:34px 48px;border-radius:48px"><img src="${img(B.logo)}" style="height:${B.logoCtaH||170}px;display:block"></div></div>
  <div class="H" style="position:absolute;left:60px;right:60px;top:${330+(B.logoCtaH||170)+90}px;text-align:center;font-size:76px">${words(s.atas||('Sewa laptop *'+B.kota+'*'),b0+.9,.18)}</div>
  <div class="a" style="position:absolute;left:0;right:0;top:${330+(B.logoCtaH||170)+200}px;text-align:center;${A('popIn',.45,b0+1.6)}"><span style="font-weight:700;font-size:44px;opacity:.7">mulai </span><span class="H" style="font-size:150px;color:var(--pop)">${s.harga?s.harga:`<span style="font-size:.5em;vertical-align:.7em">Rp</span><span id="${id}">0</span>`}</span><span style="font-weight:800;font-size:48px">/hari</span></div>

};

window.render=function(spec,B){
  const v=document.getElementById('v'); const T=B.tema;
  for(const [k,val] of Object.entries(T.vars)) v.style.setProperty('--'+k,val);
  for(const [k,val] of Object.entries(T.vid||{})) v.style.setProperty('--'+k,val);
  hooks.length=0; let b=0, html='';
  for(const s of spec.scenes){ const n=s.beats||8;
    html+=`<div class="sc a" data-bs="${b}" data-be="${b+n}" style="z-index:${10+b};${b>0?A('sceneIn',.38,b,'cubic-bezier(.7,0,.2,1)'):''}">${S[s.tipe](s,b,n,B)}</div>`;
    b+=n; }
  const total=b;
  v.innerHTML=`<div style="position:absolute;inset:0;animation:beat var(--B) calc(${spec.dropBeat||4}*var(--B)) infinite">${html}</div>
   <div class="brand a" data-bs="0" data-be="${total-(spec.scenes.at(-1).beats||8)}" style="${A('popIn',.4,0)}"><img src="${img(B.logo)}"></div>
   <div class="prog"><i style="animation:prog ${total*Bs}s 0s linear both"></i></div><div class="grain"></div>`;
  // stabilo: animasikan --mx tiap .mk sesuai delay kata
  for(const e of v.querySelectorAll('.mk')){ const d=parseFloat((e.style.animation.match(/calc\(([\d.]+)/)||[0,0])[1]); e.animate([{'--mx':0},{'--mx':1}],{duration:350,delay:(d+0.9)*Bs*1000,fill:'both',easing:'cubic-bezier(.2,.9,.2,1)'}); }
  window.TOTAL=total*Bs;
  return document.fonts.ready.then(()=>total*Bs);
};
window.seek=function(t){
  for(const n of document.querySelectorAll('[data-bs]')) n.style.visibility=(t>=n.dataset.bs*Bs&&t<n.dataset.be*Bs)?'':'hidden';
  for(const a of document.getAnimations()){a.pause();a.currentTime=t*1000;}
  for(const h of hooks) h(t);
};
